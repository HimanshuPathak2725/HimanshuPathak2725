name: Update README Stats

on:
  schedule:
    # Runs every 6 hours. GitHub cron can lag by 5-40+ min on free tier,
    # so don't expect second-level freshness.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]      # also refresh right after you push

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update README
        env:
          GH_USERNAME: HimanshuPathak2725
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update README stats"
          file_pattern: README.md